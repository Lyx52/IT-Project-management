# Production stack for the Azure VM. Run it through deploy/deploy.sh, which
# passes --env-file .env.production (created by deploy/init-env.sh).
#
# Only the proxy publishes ports, and requests pass through Anubis on the way
# in. The database sits on an internal network with no published port, so
# nothing outside Docker can reach it.

name: itpm

services:
  proxy:
    build:
      context: .
      dockerfile: docker/prod/proxy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates, kept across rebuilds so Let's Encrypt isn't asked again
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on: [anubis, backend]

  # Bot filter between the public site and the app, see "Bot protection" in
  # DEPLOYMENT_GUIDE.md. Browsers solve a short proof-of-work once, known AI
  # scrapers are refused. Rules: docker/prod/anubis/botPolicies.yaml
  anubis:
    # Pinned: the bundled default rules change between versions
    image: ghcr.io/techarohq/anubis:v1.28.2
    restart: unless-stopped
    environment:
      BIND: ":8923"
      # Back into the proxy container, which routes to the SPA or backend
      TARGET: http://proxy:3000
      POLICY_FNAME: /data/botPolicies.yaml
      # After a solved challenge Anubis redirects back to the page asked for.
      # Only ever to this site, or a crafted link could send people elsewhere.
      REDIRECT_DOMAINS: ${SITE_ADDRESS}
      # Signs the pass cookie. Keeps visitors from being challenged again
      # after every restart; if empty, Anubis picks a random key at startup.
      ED25519_PRIVATE_KEY_HEX: ${ANUBIS_KEY:-}
      # How long a solved challenge lasts. The SPA reloads itself if it
      # expires mid-session, see project/frontend/src/app/services/anubis-interceptor.ts
      COOKIE_EXPIRATION_TIME: ${ANUBIS_COOKIE_EXPIRATION:-168h}
    volumes:
      # The folder, not the single file: git pull replaces the file, and a
      # single-file mount would keep showing the old one. Anubis reads the
      # rules only at startup; deploy.sh recreates it on every deploy.
      - ./docker/prod/anubis:/data:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/prod/backend/Dockerfile
    restart: unless-stopped
    environment: &laravel-env
      APP_NAME: ${APP_NAME:-Lost and Found}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY in .env.production}
      APP_DEBUG: "false"
      APP_URL: https://${SITE_ADDRESS}
      FRONTEND_URL: https://${SITE_ADDRESS}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SANCTUM_STATEFUL_DOMAINS: ${SITE_ADDRESS}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-onboarding@resend.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Off until the project has its own mail domain, see config/verification.php
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      # Sign-up CAPTCHA: math, determinant or hash, see config/captcha.php
      CAPTCHA_TYPE: ${CAPTCHA_TYPE:-hash}
      # Days until soft-deleted accounts are permanently deleted, see config/retention.php
      ACCOUNT_PURGE_DAYS: ${ACCOUNT_PURGE_DAYS:-21}
    volumes:
      # Uploads (avatars, post images, message attachments) survive rebuilds
      - app-storage:/app/storage
    networks: [web, internal]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.production}
      APP_DB_NAME: ${DB_DATABASE:-app}
      APP_DB_USER: ${DB_USERNAME:-app}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    # No "ports:" on purpose. Do not add one, Docker-published ports bypass ufw.
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${APP_DB_USER} -d $${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily pg_dump uploaded to Oracle Cloud Object Storage, kept there for
  # 7 days. See "Backups" in README.md.
  backup:
    build:
      context: .
      dockerfile: docker/prod/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE:-app}
      PGUSER: ${DB_USERNAME:-app}
      PGPASSWORD: ${DB_PASSWORD}
      # Write-only bucket URL (pre-authenticated request), from deploy/backup-storage.sh setup
      BACKUP_UPLOAD_URL: ${BACKUP_UPLOAD_URL:-}
      BACKUP_AT: ${BACKUP_AT:-02:00}
    # internal to reach db, outbound to reach Oracle. No ports.
    networks: [internal, outbound]
    depends_on:
      db:
        condition: service_healthy

  # Laravel's scheduler (routes/console.php), e.g. the daily purge of deleted
  # accounts. Same image and settings as backend, no web server.
  scheduler:
    build:
      context: .
      dockerfile: docker/prod/backend/Dockerfile
    restart: unless-stopped
    environment: *laravel-env
    volumes:
      # Same uploads as backend, the purge deletes users' files
      - app-storage:/app/storage
    networks: [internal]
    command: ["php", "artisan", "schedule:work"]
    # The image's healthcheck probes the web server, which doesn't run here
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

networks:
  web: {}
  # No route in or out, only containers attached to it can talk to each other
  internal:
    internal: true
  # Internet access for the backup container only
  outbound: {}

volumes:
  db-data:
  app-storage:
  caddy-data:
  caddy-config:
