name: CI

# Builds and tests every pull request. Mark the jobs below as required status
# checks on main so a red PR can't be merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project/backend

    # Same Postgres as production, so migrations that only work on SQLite fail here
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real environment variables win over the SQLite defaults in phpunit.xml and .env
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: app
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4" # matches docker/prod/backend/Dockerfile
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('project/backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Fails on style issues without changing files. Fix locally with: vendor/bin/pint
      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Roll back migrations
        run: php artisan migrate:rollback --force

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches docker/prod/proxy/Dockerfile
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uses .prettierrc. Fix locally with: npx prettier --write src
      - name: Lint (Prettier)
        run: npx prettier --check src

      - name: Run tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build --configuration production

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backend, proxy]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the same images deploy/deploy.sh builds on the server, without pushing
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
