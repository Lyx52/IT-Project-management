<div class="panel p-3">

  <h5 class="fw-bold mb-1">Report an item</h5>
  <p class="text-muted small mb-3">
    Help someone find their belongings.
  </p>

  <div class="type-selector d-flex gap-2 mb-3">
    <button class="btn btn-lost flex-fill">
      <i class="bi bi-search me-1"></i>
      Lost
    </button>

    <button class="btn btn-found flex-fill">
      <i class="bi bi-check-circle me-1"></i>
      Found
    </button>
  </div>

  <div class="image-upload mb-3">
    <i class="bi bi-cloud-arrow-up fs-2"></i>
    <p class="mb-0 mt-2">Upload item photo</p>
    <small class="text-muted">Click to browse</small>
  </div>

  <div class="mb-3">
    <label class="form-label">Item name</label>
    <input class="form-control" placeholder="e.g. Black backpack">
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select class="form-select">
      <option>Select category</option>
      <option>Electronics</option>
      <option>Accessories</option>
      <option>Clothing</option>
      <option>Documents</option>
      <option>Other</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" class="form-control">
  </div>

  <div class="mb-3">
    <label class="form-label">Location</label>
    <input class="form-control" placeholder="Where was it lost/found?">
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" rows="3"
      placeholder="Describe the item..."></textarea>
  </div>

  <button class="btn btn-primary w-100">
    Submit report
  </button>

</div>
