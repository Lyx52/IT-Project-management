<aside class="safety-tips" role="note" aria-labelledby="safety-tips-title">
  <div class="safety-tips-head">
    <h2 id="safety-tips-title" class="safety-tips-title">
      <i class="bi bi-shield-exclamation" aria-hidden="true"></i>
      Staying safe
    </h2>

    <button class="safety-tips-hide" type="button" (click)="collapse()">Hide</button>
  </div>

  <ul class="safety-tips-list">
    <li>Meet in a public place.</li>
    <li>Tell someone where you are going.</li>
    <li>Trust your instincts; leave if it feels wrong.</li>
    <li>Check the person is who they said they are.</li>
    <li>Keep personal details private until you are comfortable.</li>
  </ul>
</aside>
