<div class="panel p-3">
  <h5 class="fw-bold mb-1">{{ texts.ftitle }}</h5>
  <p class="text-muted small mb-3">{{ texts.fp }}</p>

  <div class="type-selector d-flex gap-2 mb-3">
    <button class="btn btn-lost flex-fill">
      <i class="bi bi-search me-1"></i>
       {{ texts.lost }}
    </button>

    <button class="btn btn-found flex-fill">
      <i class="bi bi-check-circle me-1"></i>
      {{ texts.found }}
    </button>
  </div>

  <div class="image-upload mb-3">
    <i class="bi bi-cloud-arrow-up fs-2"></i>
    <p class="mb-0 mt-2">{{ texts.picturep }}</p>
    <small class="text-muted">{{ texts.pictures }}</small>
  </div>

  <div class="mb-3">
    <label class="form-label">{{ texts.itname }}</label>
    <input class="form-control" placeholder="e.g. Black backpack" />
  </div>

  <div class="mb-3">
    <label class="form-label">{{ texts.label }}</label>
    <select class="form-select">
      <option>{{ texts.option1 }}</option>
      <option>{{ texts.select3 }}</option>
      <option>{{ texts.select2 }}</option>
      <option>{{ texts.option2 }}</option>
      <option>{{ texts.select4 }}</option>
      <option>{{ texts.option3 }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">{{ texts.date }}</label>
    <input type="date" class="form-control" />
  </div>

  <div class="mb-3">
    <label class="form-label">{{ texts.location }}</label>
    <input class="form-control" placeholder="Where was it lost/found?" />
  </div>

  <div class="mb-3">
    <label class="form-label">{{ texts.description }}</label>
    <textarea class="form-control" rows="3" placeholder="Describe the item..."></textarea>
  </div>

  @if (isAuthenticated()) {
    <button class="btn btn-primary w-100">{{ texts.submit }} report</button>
  } @else {
    <a class="btn btn-primary w-100" routerLink="/login">Sign in to report an item</a>
    <p class="text-muted small text-center mb-0 mt-2">
      You need an account to report a lost or found item.
    </p>
  }
</div>
