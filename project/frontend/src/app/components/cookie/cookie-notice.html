<div class="cookie-notice">
  <h1 class="cookie-notice-title">{{ texts.cookieTitle }}</h1>
  <p class="cookie-notice-text">{{ texts.cookieText }}</p>
  <button
    type="button"
    class="cookie-notice-close"
    (click)="closeCookieNotice()"
    aria-label="Close cookie notice"
  >
    {{ texts.closeButton }}
  </button>
</div>
