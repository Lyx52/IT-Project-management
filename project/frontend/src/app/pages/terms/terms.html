<app-header />

<div class="terms-container">
  <div class="terms-head">
    <h1 class="terms-title">{{ termdata.Terms }}</h1>
    <span class="terms-version">Version {{ version }}</span>
  </div>

  <section class="terms-section">
    <p class="terms-text">{{ termdata.text }}</p>
  </section>

  <section class="terms-section">
    <h2 class="terms-subtitle">{{ termdata.sectionTitle }}</h2>
    <p class="terms-text">{{ termdata.sectionText }}</p>
  </section>

  <section class="terms-section">
    <p class="terms-text">{{ termdata.termsText }}</p>
    <p class="terms-text terms-crosslink">
      {{ termdata.seeAlso }}
      <a routerLink="/privacy">{{ termdata.ptitle }}</a>
    </p>
  </section>
</div>
