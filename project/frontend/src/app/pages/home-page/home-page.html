<app-header />

<main class="container-fluid px-3 px-lg-4 py-4">
  <!-- Search section -->
  <div class="search-section mb-4">
    <div>
      <h4 class="fw-bold mb-1">{{ texts.hometitle }}</h4>
      <p class="text-muted mb-0">{{ texts.searchp }}</p>
    </div>

    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" placeholder="Search for an item..." />
      <button class="btn btn-primary">Search</button>
    </div>
  </div>

  <!-- Main layout -->
  <div class="row g-4">
    <!-- Left column -->
    <div class="col-12 col-lg-3">
      <app-item-form />
    </div>

    <!-- Center column -->
    <div class="col-12 col-lg-6">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="fw-bold mb-1">{{ texts.subtitlehome }}</h5>
          <p class="text-muted small mb-0">{{ texts.subp }}</p>
        </div>

        <button class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-funnel me-1"></i>
          {{ texts.filttitle }}
        </button>
      </div>

      <div class="row g-3">
        @for (item of items; track item.id) {
          <div class="col-12 col-md-6">
            <app-item-card [item]="item" />
          </div>
        }
      </div>
    </div>

    <!-- Right column -->
    <div class="col-12 col-lg-3">
      <app-messenger />
    </div>
    @if (isVisible) {
      <div class="col-12 terms-container">
        <app-terms (hideTriggered)="hideTerms()" />
      </div>
    }
    @if (cookieVisible) {
      <div class="cookie-container">
        <app-cookie-notice (hidecookieTrig)="hidecookie()" />
      </div>
    }
  </div>
</main>
<app-footer (showTriggered)="showTerms()" />
