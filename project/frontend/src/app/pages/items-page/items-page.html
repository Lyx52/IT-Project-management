<app-header />

<main class="container-fluid px-3 px-lg-4 py-4">
  <!-- Page heading and search -->
  <section class="page-heading mb-4">
    <div>
      <h4 class="fw-bold mb-1">{{ pageTitle }}</h4>
      <p class="text-muted mb-0">{{ pageDescription }}</p>
    </div>

    <div class="search-box">
      <i class="bi bi-search"></i>

      <input type="text" class="form-control" placeholder="Search for an item..." />

      <button class="btn btn-primary">Search</button>
    </div>
  </section>

  <!-- Filters -->
  <!-- <section class="filter-section mb-4">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-funnel"></i>
      <span class="fw-semibold">Filters</span>
    </div>

    <div class="filter-controls">
      <select class="form-select">
        <option selected>All categories</option>
        <option>Accessories</option>
        <option>Electronics</option>
        <option>Documents</option>
      </select>

      <input type="date" class="form-control" />

      <input type="date" class="form-control" />

      <button class="btn btn-outline-secondary">Reset filters</button>
    </div>
  </section> -->
    
  <app-item-filters class="d-block mb-4" (filtersChange)="onFiltersChange($event)" />

  <!-- Items -->
  <section>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="fw-bold mb-1">{{ pageTitle }}</h5>
        <p class="text-muted small mb-0">{{ filteredItems.length }} items available</p>
      </div>

      <button class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-sort-down me-1"></i>
        Newest first
      </button>
    </div>

    @if (filteredItems.length > 0) {
      <div class="row g-3">
        @for (item of filteredItems; track item.id) {
          <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <app-item-card [item]="item" />
          </div>
        }
      </div>
    } @else {
      <div class="empty-state">
        <i class="bi bi-search"></i>
        <h6 class="fw-bold mt-3">No items found</h6>
        <p class="text-muted mb-0">There are currently no items in this category.</p>
      </div>
    }
  </section>
</main>
