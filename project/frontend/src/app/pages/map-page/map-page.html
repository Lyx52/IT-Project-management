<app-header />

<main class="container-fluid px-3 px-lg-4 py-4">
  <div class="page-heading mb-4">
    <div>
      <h4 class="fw-bold mb-1">{{ texts.maptitle }}</h4>
      <p class="text-muted mb-0">{{ texts.maptext }}</p>
    </div>

    <div class="map-search">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" placeholder="Search location..." />
      <button class="btn btn-primary">{{ texts.searchbutton }}</button>
    </div>
  </div>

  <div class="row g-4">
    <!-- Items list -->
    <div class="col-12 col-lg-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="fw-bold mb-1">{{ texts.nearbyItems }}</h5>
          <p class="text-muted small mb-0">{{ items.length }} {{ texts.itemsOnMap }}</p>
        </div>

        <button class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-funnel me-1"></i>
          {{ texts.filttitle }}
        </button>
      </div>

      <div class="map-items-list">
        @for (item of items; track item.id) {
          <app-item-card [item]="item" />
        }
      </div>
    </div>

    <!-- Map -->
    <div class="col-12 col-lg-8">
      <section class="map-container">
        <div class="map-toolbar">
          <span>
            <i class="bi bi-geo-alt me-1"></i>
            Riga, Latvia
          </span>

          <button class="btn btn-light btn-sm">
            <i class="bi bi-crosshair me-1"></i>
            {{ texts.myLocation }}
          </button>
        </div>

        <div class="map-placeholder">
          <div class="map-area-label label-one">CENTRE</div>
          <div class="map-area-label label-two">OLD TOWN</div>
          <div class="map-area-label label-three">UNIVERSITY</div>

          <div class="map-road road-one"></div>
          <div class="map-road road-two"></div>
          <div class="map-road road-three"></div>
          <div class="map-road road-four"></div>

          <div class="map-marker marker-one lost-marker">
            <i class="bi bi-backpack"></i>
          </div>

          <div class="map-marker marker-two found-marker">
            <i class="bi bi-key"></i>
          </div>

          <div class="map-marker marker-three lost-marker">
            <i class="bi bi-headphones"></i>
          </div>

          <div class="map-marker marker-four found-marker">
            <i class="bi bi-person-vcard"></i>
          </div>

          <div class="map-legend">
            <span>
              <i class="legend-dot lost-dot"></i>
              {{ texts.lost }}
            </span>

            <span>
              <i class="legend-dot found-dot"></i>
              {{ texts.found }}
            </span>
          </div>

          <div class="map-attribution">Map preview — real map integration planned</div>
        </div>
      </section>
    </div>
  </div>
  @if (isVisible) {
    <div class="col-12 terms-container">
      <app-terms (hideTriggered)="hideTerms()" />
    </div>
  }
</main>
<app-footer (showTriggered)="showTerms()" />
