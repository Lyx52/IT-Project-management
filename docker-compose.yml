services:
  db:
    image: postgres:17-alpine
    container_name: itpm-db
    environment:
      # Superuser, only for admin tasks. Laravel connects as APP_DB_USER
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      # Created by docker/db/initdb on first start
      APP_DB_NAME: ${DB_DATABASE:-app}
      APP_DB_USER: ${DB_USERNAME:-app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only, so the DB is not reachable from your network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server used during init only listens on a socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${APP_DB_USER} -d $${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./docker/backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: itpm-backend
    working_dir: /var/www/backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_URL: http://localhost:${BACKEND_PORT:-8001}
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # E-mail (verification links). Set MAIL_MAILER=resend and RESEND_API_KEY in .env to send real mail
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-onboarding@resend.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./project/backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./docker/frontend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: itpm-frontend
    working_dir: /var/www/frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./project/frontend:/var/www/frontend

  # Optional DB web UI: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itpm-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
